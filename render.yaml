# ==============================================================================
# Render Blueprint Specification for CampusAI
# Reference: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: campusai-app
    env: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: "mock"
      - key: FALLBACK_SQLITE_URL
        value: "sqlite:///campusai.db"
