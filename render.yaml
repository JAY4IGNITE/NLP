# ==============================================================================
# Render Blueprint Specification for CampusAI
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: campusai-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: FALLBACK_SQLITE_URL
        value: sqlite:///campusai.db
